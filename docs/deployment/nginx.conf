# Include these blocks in nginx's http context. Substitute your hostnames,
# certificate paths, and upstream before enabling the configuration.
limit_req_zone $binary_remote_addr zone=mcp:10m rate=10r/s;

server {
    listen 443 ssl;
    server_name admin.gateway.example;
    ssl_certificate /etc/nginx/tls/admin.fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/admin.key;
    client_max_body_size 128k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    server_name mcp.gateway.example;
    ssl_certificate /etc/nginx/tls/mcp.fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/mcp.key;
    client_max_body_size 1m;

    location ~ ^/api/mcp/[a-z0-9-]+$ {
        limit_except GET POST DELETE { deny all; }
        limit_req zone=mcp burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location ~ ^/\.well-known/oauth-protected-resource/api/mcp/[a-z0-9-]+$ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    location / { return 404; }
}
