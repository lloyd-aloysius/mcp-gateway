name: Release

# Fires only when a version tag (v1.2.3) is pushed — never on a normal
# commit to main. That's what makes "release" a deliberate action instead
# of something that happens on every push.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write # required for npm Trusted Publishing (OIDC) - no NPM_TOKEN secret needed

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      # Trusted Publishing needs a recent npm CLI (11.5+); the version bundled
      # with actions/setup-node's Node 22 image may be older.
      - run: npm install -g npm@latest

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
